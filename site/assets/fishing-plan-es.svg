<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-labelledby="title desc"><title id="title">Lista de estrategia de pesca</title><desc id="desc">Elige recompensas, confirma el evento, registra capturas y roturas, recalcula antes de gastar.</desc><rect width="840" height="440" rx="14" fill="#0d1723"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="38" fill="#d3ad63" font-size="12" letter-spacing="2">PESCA / PREPARA CADA LANZAMIENTO</text><path d="M35 330 Q100 305 165 330 T295 330 M35 350 Q100 325 165 350 T295 350" stroke="#405c65" stroke-width="2" fill="none"/><path d="M85 203 Q165 122 250 203 Q165 284 85 203 L50 168 L50 238 Z" fill="#d3ad63"/><circle cx="216" cy="195" r="5" fill="#0d1723"/><path d="M179 133 L179 80 Q179 65 197 65 L280 65" stroke="#9fadb9" fill="none" stroke-width="2"/><text x="160" y="298" text-anchor="middle" fill="#d3ad63" font-size="20">Cada captura cuenta.</text><g fill="#142333" stroke="#304255"><rect x="350" y="70" width="455" height="65" rx="8"/><rect x="350" y="150" width="455" height="65" rx="8"/><rect x="350" y="230" width="455" height="65" rx="8"/><rect x="350" y="310" width="455" height="65" rx="8"/></g><g fill="#d3ad63" font-size="22"><text x="370" y="110">01</text><text x="370" y="190">02</text><text x="370" y="270">03</text><text x="370" y="350">04</text></g><g fill="#eef0ed" font-size="17"><text x="420" y="98">Elige tu ruta de recompensas</text><text x="420" y="178">Comprueba el evento y el banco</text><text x="420" y="258">Registra capturas y roturas</text><text x="420" y="338">Recalcula antes de comprar</text></g><g fill="#9fadb9" font-size="12"><text x="420" y="120">¿Progreso de plata o más intentos legendarios?</text><text x="420" y="200">Los lagos normales y los especiales son distintos.</text><text x="420" y="280">Una rotura no elimina ese pez del banco.</text><text x="420" y="360">Cuenta los cebos gratuitos pendientes. Compra poco.</text></g><text x="30" y="412" fill="#9fadb9" font-size="12">Comprueba tu evento. Los bancos históricos y los patrones de caña no son reglas universales.</text></g></svg>