<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-labelledby="title desc"><title id="title">Fishing strategy checklist</title><desc id="desc">Choose a reward route, confirm event variant, track catches and line breaks, recalculate before spending.</desc><rect width="840" height="440" rx="14" fill="#0d1723"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="38" fill="#d3ad63" font-size="12" letter-spacing="2">ANGLER'S BOUNTY / CAST WITH A PLAN</text><path d="M35 330 Q100 305 165 330 T295 330 M35 350 Q100 325 165 350 T295 350" stroke="#405c65" stroke-width="2" fill="none"/><path d="M85 203 Q165 122 250 203 Q165 284 85 203 L50 168 L50 238 Z" fill="#d3ad63"/><circle cx="216" cy="195" r="5" fill="#0d1723"/><path d="M179 133 L179 80 Q179 65 197 65 L280 65" stroke="#9fadb9" fill="none" stroke-width="2"/><text x="160" y="298" text-anchor="middle" fill="#d3ad63" font-size="20">Every cast has context.</text><g fill="#142333" stroke="#304255"><rect x="350" y="70" width="455" height="65" rx="8"/><rect x="350" y="150" width="455" height="65" rx="8"/><rect x="350" y="230" width="455" height="65" rx="8"/><rect x="350" y="310" width="455" height="65" rx="8"/></g><g fill="#d3ad63" font-size="22"><text x="370" y="110">01</text><text x="370" y="190">02</text><text x="370" y="270">03</text><text x="370" y="350">04</text></g><g fill="#eef0ed" font-size="17"><text x="420" y="98">Choose your reward route</text><text x="420" y="178">Match the event and pool</text><text x="420" y="258">Log catches and line breaks</text><text x="420" y="338">Recalculate before buying</text></g><g fill="#9fadb9" font-size="12"><text x="420" y="120">Silver progression or extra legendary attempts?</text><text x="420" y="200">Standard lakes and special variants differ.</text><text x="420" y="280">A broken line does not remove that fish.</text><text x="420" y="360">Count free lures still to come. Buy small batches.</text></g><text x="30" y="412" fill="#9fadb9" font-size="12">Track your actual event. Historical pool sizes and rod patterns are not universal rules.</text></g></svg>